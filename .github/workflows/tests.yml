name: Package and offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SC2PATH: /nonexistent/mpsc2
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_docs.py
      - run: python -m pytest -q --cov=mpsc2 --cov-branch --cov-report=xml --junitxml=test-results.xml
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel and resolve maps outside checkout
        shell: bash
        run: |
          python -m pip uninstall -y mpsc2
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m mpsc2 maps
          python -c 'from mpsc2.bot_ai import BotAI; from sc2.bot_ai import BotAI as Original; assert BotAI is Original'
          python -m pip check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            test-results.xml
            dist/*

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify release version and notes
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tree = ast.parse(Path('src/mpsc2/__init__.py').read_text())
          exported = next(ast.literal_eval(node.value) for node in tree.body
                          if isinstance(node, ast.Assign)
                          and any(isinstance(target, ast.Name) and target.id == '__version__'
                                  for target in node.targets))
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag/version mismatch'
          assert exported == version, 'Exported version mismatch'
          assert Path(f'docs/release-notes-{version}.md').is_file(), 'Missing release notes'
          PY
      - name: Build and check release packages
        run: |
          python -m pip install 'build>=1.2' 'twine>=5'
          python -m build
          python -m twine check dist/*
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Upload, verify and publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          gh release create "$tag" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --prerelease --title "MPSC2 $version" \
            --notes-file "docs/release-notes-$version.md"
          gh release download "$tag" --dir "$RUNNER_TEMP/release-check"
          (cd "$RUNNER_TEMP/release-check" && sha256sum --check SHA256SUMS)
          gh release edit "$tag" --draft=false --prerelease
